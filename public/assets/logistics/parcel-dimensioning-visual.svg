<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Optical parcel dimensioning and volumetrics</title>
  <desc id="desc">A conveyor-mounted optical profiler measures parcel length, width and height for volumetric processing.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071829"/><stop offset="1" stop-color="#12344a"/></linearGradient>
    <linearGradient id="box" x2="1" y2="1"><stop stop-color="#d2a77e"/><stop offset="1" stop-color="#936541"/></linearGradient>
    <linearGradient id="belt" y2="1"><stop stop-color="#426477"/><stop offset="1" stop-color="#142d3d"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8bd8e8" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 690H1600V900H0Z" fill="url(#belt)"/><path d="M0 701H1600" stroke="#72e4f6" stroke-opacity=".5" stroke-width="4"/>
  <path d="M595 213V681M1000 213V681M595 228H1000" fill="none" stroke="#87aeba" stroke-width="20"/>
  <path d="M650 250H948V344H650z" fill="#122d3e" stroke="#7ea5b3" stroke-width="6"/>
  <path d="M698 344l38 226h-76zM900 344l-38 226h76z" fill="#55e8d3" opacity=".12"/>
  <path d="M698 344l38 226M900 344l-38 226" stroke="#55e8d3" stroke-width="5" stroke-dasharray="10 10" filter="url(#glow)"/>
  <g transform="translate(635 460)">
    <path d="M0 50l174-78 212 80-182 96z" fill="url(#box)" stroke="#e9c19a" stroke-width="6"/>
    <path d="M0 50v142l204 105V148z" fill="#916444" stroke="#d0a47b" stroke-width="6"/>
    <path d="M204 148l182-96v141l-182 104z" fill="#bd8a5e" stroke="#e4b98e" stroke-width="6"/>
    <path d="M170-26v174M126-8l89 175" stroke="#e9c19a" stroke-width="6" opacity=".75"/>
  </g>
  <g fill="none" stroke="#55e8d3" stroke-width="5">
    <path d="M635 770h386"/><path d="M635 754v32M1021 754v32"/>
    <path d="M1080 500l-174 92"/><path d="M1080 500v176"/>
    <path d="M580 465l180-82"/>
  </g>
