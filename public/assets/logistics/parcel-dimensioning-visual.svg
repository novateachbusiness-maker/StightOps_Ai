    <text x="112" y="90" fill="#aeeaf2" font-size="20" letter-spacing="3">SIGHTOPS AI  /  LOGISTICS VISION</text>
    <text x="64" y="174" fill="#fff" font-size="42" font-weight="700">OPTICAL PARCEL DIMENSIONING</text>
    <text x="66" y="213" fill="#9dc0d0" font-size="23">3D profile capture for parcel volumetrics</text>
