    <g fill="#16e7a4"><circle cx="1280" cy="372" r="6"/><circle cx="1280" cy="413" r="6"/><circle cx="1280" cy="454" r="6"/><circle cx="1280" cy="495" r="6"/></g>
    <rect x="1055" y="592" width="450" height="82" rx="14" fill="#0c2538" stroke="#164d69"/>
    <text x="1080" y="624" fill="#91aebe" font-size="15" letter-spacing="2">3D VOLUMETRIC MEASUREMENT</text>
    <text x="1080" y="654" fill="#fff" font-size="18" font-weight="700">LENGTH  ·  WIDTH  ·  HEIGHT  ·  VOLUME</text>
    <rect x="64" y="796" width="1472" height="62" rx="14" fill="#071729" stroke="#087fbd" stroke-width="2"/>
    <text x="92" y="834" fill="#48dcff" font-size="17" letter-spacing="2">SIGHTOPS AI  /  FREIGHT VOLUMETRICS</text>
    <text x="1508" y="834" fill="#b9d1df" font-size="17" text-anchor="end">3D PROFILE  ·  NON-CONTACT DIMENSIONING</text>
