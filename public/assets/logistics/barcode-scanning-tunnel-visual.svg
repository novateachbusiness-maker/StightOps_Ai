    <path d="M468 420h38v76h-38z"/><path d="M1098 420h38v76h-38z"/>
    <path d="M625 640h72v38h-72z"/><path d="M905 640h72v38h-72z"/>
  </g>
  <g fill="#55e8d3" filter="url(#glow)"><path d="M556 327l-18 155h55l-18-155z" opacity=".16"/><path d="M1036 327l-20 155h58l-18-155z" opacity=".16"/><path d="M484 458h165v25H484z" opacity=".18"/></g>
