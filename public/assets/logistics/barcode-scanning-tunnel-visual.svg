    <rect x="1055" y="592" width="450" height="82" rx="14" fill="#0c2538" stroke="#164d69"/>
    <text x="1080" y="624" fill="#91aebe" font-size="15" letter-spacing="2">MULTI-FACE READ ZONE</text>
    <text x="1080" y="654" fill="#fff" font-size="18" font-weight="700">TOP  ·  SIDES  ·  FRONT  ·  REAR  ·  BASE</text>
    <rect x="64" y="796" width="1472" height="62" rx="14" fill="#071729" stroke="#087fbd" stroke-width="2"/>
