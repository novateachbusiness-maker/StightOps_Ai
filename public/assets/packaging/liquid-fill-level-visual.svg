<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Liquid fill-level verification</title>
  <desc id="desc">A backlit machine-vision inspection checks the meniscus against a fill-level tolerance window.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071829"/><stop offset="1" stop-color="#12344a"/></linearGradient>
    <linearGradient id="glass" x2="1"><stop stop-color="#b8f5ff" stop-opacity=".12"/><stop offset=".5" stop-color="#d6fbff" stop-opacity=".48"/><stop offset="1" stop-color="#56b8d2" stop-opacity=".16"/></linearGradient>
    <linearGradient id="liquid" y2="1"><stop stop-color="#31d1c2" stop-opacity=".85"/><stop offset="1" stop-color="#087eaa" stop-opacity=".72"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8bd8e8" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 680H1600V900H0Z" fill="#18384b"/><path d="M0 691H1600" stroke="#75e8f4" stroke-opacity=".5" stroke-width="4"/>
  <g transform="translate(590 202)">
    <path d="M106 133h265l-15 351q-3 62-59 70H180q-56-8-59-70Z" fill="url(#glass)" stroke="#bdeefa" stroke-width="8"/>
    <path d="M131 329q107 10 215 0l-8 157q-3 52-54 59H182q-51-7-54-59Z" fill="url(#liquid)"/>
    <path d="M131 329q107 10 215 0" fill="none" stroke="#a2fff0" stroke-width="7" filter="url(#glow)"/>
    <path d="M162 101h153v91H162z" rx="16" fill="#0979b5" stroke="#8beaff" stroke-width="6"/>
    <path d="M180 117h117M180 142h117M180 167h117" stroke="#b7f4ff" stroke-width="5" opacity=".65"/>
    <path d="M131 294h215M131 365h215" stroke="#ffd166" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M108 294H72v71h36" fill="none" stroke="#55e8d3" stroke-width="6"/>
    <path d="M72 329H-5" stroke="#55e8d3" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#55e8d3" stroke-width="4">
    <path d="M933 526h125l58 57h113"/><path d="M900 322h121l68-69h122"/>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="58" width="385" height="50" rx="25" fill="#0b3042" stroke="#3b8194"/><circle cx="91" cy="83" r="8" fill="#55e8d3"/>
    <text x="112" y="90" fill="#aeeaf2" font-size="20" letter-spacing="3">SIGHTOPS AI  /  PACKAGING QC</text>
    <text x="64" y="174" fill="#fff" font-size="42" font-weight="700">LIQUID FILL-LEVEL CHECK</text>
    <text x="66" y="213" fill="#9dc0d0" font-size="23">Backlit meniscus detection for glass and PET</text>
    <rect x="1120" y="72" width="410" height="118" rx="18" fill="#102b3c" stroke="#3d7488"/>
    <circle cx="1160" cy="113" r="9" fill="#55e8d3"/><text x="1184" y="121" fill="#a9c5d1" font-size="19">INSPECTION MODE</text>
    <text x="1150" y="164" fill="#55e8d3" font-size="27" font-weight="700">MENISCUS  /  FILL WINDOW</text>
    <text x="1076" y="246" fill="#a8e8ee" font-size="20">REFERENCE BAND</text>
    <text x="1076" y="608" fill="#a8e8ee" font-size="20">LEVEL DETECTED</text>
    <rect x="1045" y="671" width="460" height="76" rx="18" fill="#0a2030" stroke="#2b6075"/>
    <text x="1080" y="718" fill="#fff" font-size="23" font-weight="700">UNDERFILL  /  OVERFILL  /  PASS</text>
