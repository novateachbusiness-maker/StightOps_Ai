    <path d="m1405 267 8 8 16-18" fill="none" stroke="#06372f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1436" y="276" fill="#06372f" font-size="21" font-weight="700">PASS</text>
    <text x="1055" y="329" fill="#4ddaff" font-size="16" letter-spacing="2">ILLUSTRATIVE SAMPLE INSPECTION</text>
    <rect x="1055" y="352" width="215" height="214" rx="12" fill="#0d2940" stroke="#26739a" stroke-width="2"/>
    <path d="M1135 382h56l-7 140h-42z" fill="#8feaff" fill-opacity=".15" stroke="#bceefa" stroke-width="4"/>
    <path d="M1142 396h42v22h-42z" fill="#0789c8" stroke="#a9edfa" stroke-width="3"/>
    <path d="M1139 454q26 3 49 0l-4 63h-42z" fill="#25c9b9" fill-opacity=".75"/>
    <path d="M1139 454q26 3 49 0" fill="none" stroke="#8affdf" stroke-width="5"/>
    <path d="M1124 443h78M1124 469h78" stroke="#ffc65f" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="1078" y="542" fill="#9dbccc" font-size="16">MENISCUS / TARGET BAND</text>
    <g fill="#c6dce7" font-size="18">
      <text x="1292" y="378">Measured fill</text><text x="1504" y="378" text-anchor="end" fill="#51efbb">72.4 mm</text>
      <text x="1292" y="419">Target window</text><text x="1504" y="419" text-anchor="end" fill="#51efbb">70–75 mm</text>
      <text x="1292" y="460">Meniscus edge</text><text x="1504" y="460" text-anchor="end" fill="#51efbb">DETECTED</text>
      <text x="1292" y="501">Container</text><text x="1504" y="501" text-anchor="end" fill="#51efbb">PET / GLASS</text>
    </g>
    <g fill="#16e7a4"><circle cx="1280" cy="372" r="6"/><circle cx="1280" cy="413" r="6"/><circle cx="1280" cy="454" r="6"/><circle cx="1280" cy="495" r="6"/></g>
    <rect x="1055" y="592" width="450" height="82" rx="14" fill="#0c2538" stroke="#164d69"/>
    <text x="1080" y="624" fill="#91aebe" font-size="15" letter-spacing="2">CHECKED FEATURES</text>
    <text x="1080" y="654" fill="#fff" font-size="18" font-weight="700">UNDERFILL  ·  OVERFILL  ·  MENISCUS</text>
    <rect x="64" y="796" width="1472" height="62" rx="14" fill="#071729" stroke="#087fbd" stroke-width="2"/>
    <text x="92" y="834" fill="#48dcff" font-size="17" letter-spacing="2">SIGHTOPS AI  /  LIQUID FILL VERIFICATION</text>
    <text x="1508" y="834" fill="#b9d1df" font-size="17" text-anchor="end">BACKLIGHT VISION  ·  NON-CONTACT MEASUREMENT</text>
  </g>
</svg>
