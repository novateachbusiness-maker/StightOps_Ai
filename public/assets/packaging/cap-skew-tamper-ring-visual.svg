<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cap skew, height and tamper-ring inspection</title>
  <desc id="desc">A machine-vision station checks bottle-cap seating, alignment and tamper-band continuity on a bottling line.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071829"/><stop offset="1" stop-color="#12344a"/></linearGradient>
    <linearGradient id="glass" x2="1"><stop stop-color="#8eeaff" stop-opacity=".12"/><stop offset=".5" stop-color="#b9f4ff" stop-opacity=".42"/><stop offset="1" stop-color="#48b6d2" stop-opacity=".16"/></linearGradient>
    <linearGradient id="belt" y2="1"><stop stop-color="#426477"/><stop offset="1" stop-color="#142d3d"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8bd8e8" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 662H1600V900H0Z" fill="url(#belt)"/><path d="M0 686H1600" stroke="#72e4f6" stroke-opacity=".45" stroke-width="3"/>
  <g fill="#203d4e" stroke="#91b8c5" stroke-width="5"><circle cx="185" cy="790" r="52"/><circle cx="1420" cy="790" r="52"/></g>
  <path d="M75 800H1520" stroke="#9bbac2" stroke-width="16" stroke-linecap="round" opacity=".45"/>
  <g transform="translate(560 220)">
    <path d="M108 132h284l-18 352q-4 60-62 70H187q-58-10-62-70Z" fill="url(#glass)" stroke="#bcefff" stroke-width="8"/>
    <path d="M134 432h232l-6 55q-4 52-55 61H196q-51-9-55-61Z" fill="#28c1d2" fill-opacity=".26"/>
    <path d="M166 107h168v78H166z" rx="14" fill="#087fbd" stroke="#8beaff" stroke-width="6"/>
    <path d="M177 184h146v34H177z" fill="#31d4d0" stroke="#d7fbff" stroke-width="4"/>
    <path d="M180 125h140M180 144h140M180 163h140" stroke="#b7f4ff" stroke-width="5" opacity=".7"/>
    <path d="M160 112l160-10" stroke="#ffb454" stroke-width="6" stroke-dasharray="12 10"/>
    <ellipse cx="250" cy="149" rx="114" ry="78" fill="none" stroke="#42e8d1" stroke-width="5" filter="url(#glow)"/>
  </g>
  <g fill="none" stroke="#55e8d3" stroke-width="4">
    <path d="M824 330h130l75-80h128"/><path d="M820 431h164l49 56h118"/><path d="M817 568h145l69 46h101"/>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="58" width="385" height="50" rx="25" fill="#0b3042" stroke="#3b8194"/>
    <circle cx="91" cy="83" r="8" fill="#55e8d3"/><text x="112" y="90" fill="#aeeaf2" font-size="20" letter-spacing="3">SIGHTOPS AI  /  PACKAGING QC</text>
    <text x="64" y="174" fill="#fff" font-size="42" font-weight="700">CAP &amp; TAMPER INSPECTION</text>
    <text x="66" y="213" fill="#9dc0d0" font-size="23">Alignment · seating height · ring continuity</text>
    <rect x="1120" y="72" width="410" height="118" rx="18" fill="#102b3c" stroke="#3d7488"/>
    <circle cx="1160" cy="113" r="9" fill="#55e8d3"/><text x="1184" y="121" fill="#a9c5d1" font-size="19">VISION STATION</text>
    <text x="1150" y="164" fill="#55e8d3" font-size="27" font-weight="700">CAP SEATED  ·  RING CHECK</text>
    <text x="1088" y="255" fill="#a8e8ee" font-size="20">CAP ALIGNMENT</text>
    <text x="1092" y="512" fill="#a8e8ee" font-size="20">TAMPER BAND</text>
    <rect x="1045" y="635" width="460" height="92" rx="18" fill="#0a2030" stroke="#2b6075"/>
    <text x="1080" y="674" fill="#8faebc" font-size="18" letter-spacing="2">IN-LINE CHECKS</text>
    <text x="1080" y="709" fill="#fff" font-size="23" font-weight="700">SKEW  /  HEIGHT  /  SEAL</text>
    <rect x="814" y="303" width="22" height="22" rx="5" fill="#55e8d3"/><rect x="807" y="419" width="22" height="22" rx="5" fill="#55e8d3"/><rect x="806" y="556" width="22" height="22" rx="5" fill="#55e8d3"/>
    <rect x="1020" y="232" width="520" height="485" rx="24" fill="#071729" fill-opacity=".97" stroke="#078bff" stroke-width="4"/>
    <path d="M1040 292h480" stroke="#155071" stroke-width="2"/>
    <text x="1054" y="273" fill="#fff" font-size="25" font-weight="700">CAP &amp; TAMPER RING CHECK</text>
    <rect x="1386" y="245" width="126" height="46" rx="23" fill="#00d78a"/>
    <path d="m1405 267 8 8 16-18" fill="none" stroke="#06372f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1436" y="276" fill="#06372f" font-size="21" font-weight="700">PASS</text>
    <text x="1055" y="329" fill="#4ddaff" font-size="16" letter-spacing="2">ILLUSTRATIVE SAMPLE INSPECTION</text>
    <rect x="1055" y="352" width="215" height="214" rx="12" fill="#0d2940" stroke="#26739a" stroke-width="2"/>
    <path d="M1130 389h64l-7 130h-50z" fill="#70dff2" fill-opacity=".18" stroke="#a9edfa" stroke-width="4"/>
    <path d="M1138 372h48v27h-48z" fill="#0789c8" stroke="#a9edfa" stroke-width="3"/>
    <path d="M1137 399h50v12h-50z" fill="none" stroke="#36f0ce" stroke-width="4"/>
    <ellipse cx="1162" cy="386" rx="46" ry="31" fill="none" stroke="#16e7a4" stroke-width="3"/>
    <path d="M1119 450h86M1119 455h86" stroke="#ffca72" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="1080" y="542" fill="#9dbccc" font-size="16">CAP PROFILE / BAND</text>
    <g fill="#c6dce7" font-size="18">
      <text x="1292" y="378">Cap tilt</text><text x="1470" y="378" text-anchor="end" fill="#51efbb">0.2°</text>
      <text x="1292" y="419">Seating height</text><text x="1504" y="419" text-anchor="end" fill="#51efbb">12.4 mm</text>
      <text x="1292" y="460">Tamper band</text><text x="1504" y="460" text-anchor="end" fill="#51efbb">360° OK</text>
      <text x="1292" y="501">Thread engagement</text><text x="1504" y="501" text-anchor="end" fill="#51efbb">PASS</text>
    </g>
    <g fill="#16e7a4">
      <circle cx="1280" cy="372" r="6"/><circle cx="1280" cy="413" r="6"/><circle cx="1280" cy="454" r="6"/><circle cx="1280" cy="495" r="6"/>
    </g>
    <rect x="1055" y="592" width="450" height="82" rx="14" fill="#0c2538" stroke="#164d69"/>
    <text x="1080" y="624" fill="#91aebe" font-size="15" letter-spacing="2">CHECKED FEATURES</text>
    <text x="1080" y="654" fill="#fff" font-size="18" font-weight="700">SKEW  ·  HEIGHT  ·  TAMPER RING</text>
    <rect x="64" y="796" width="1472" height="62" rx="14" fill="#071729" stroke="#087fbd" stroke-width="2"/>
    <text x="92" y="834" fill="#48dcff" font-size="17" letter-spacing="2">SIGHTOPS AI  /  CAP CLOSURE VERIFICATION</text>
    <text x="1508" y="834" fill="#b9d1df" font-size="17" text-anchor="end">PROFILE VISION  ·  100% IN-LINE CHECK</text>
  </g>
</svg>
