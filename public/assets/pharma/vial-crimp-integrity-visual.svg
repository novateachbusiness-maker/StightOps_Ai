<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vial cap and crimp integrity inspection</title>
  <desc id="desc">A machine-vision station inspects a pharmaceutical vial's cap, aluminum crimp, stopper seating and glass neck.</desc>
