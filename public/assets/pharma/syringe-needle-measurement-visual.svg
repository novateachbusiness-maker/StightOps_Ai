<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Medical syringe and needle measurement</title>
  <desc id="desc">Telecentric optical metrology checks syringe graduations, barrel geometry, needle straightness and bevel angle.</desc>
