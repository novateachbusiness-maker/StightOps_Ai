<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Blister pocket and tablet integrity inspection</title>
  <desc id="desc">A vision system checks blister pack pockets for missing, damaged or incorrect tablets and packaging defects.</desc>
  <defs>
