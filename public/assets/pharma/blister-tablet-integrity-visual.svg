      <rect x="62" y="208" width="176" height="114" rx="48"/><rect x="278" y="208" width="176" height="114" rx="48"/><rect x="494" y="208" width="176" height="114" rx="48"/><rect x="710" y="208" width="140" height="114" rx="48"/>
    </g>
