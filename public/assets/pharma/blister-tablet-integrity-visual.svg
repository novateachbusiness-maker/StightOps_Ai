    <text x="92" y="834" fill="#48dcff" font-size="17" letter-spacing="2">SIGHTOPS AI  /  BLISTER PACK QUALITY</text>
    <text x="1508" y="834" fill="#b9d1df" font-size="17" text-anchor="end">AREA VISION  ·  CAVITY FILL &amp; SEAL CHECK</text>
